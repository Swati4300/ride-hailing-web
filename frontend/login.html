<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Login - Ride Dispatch Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .auth-wrapper {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: rgba(22, 17, 36, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(224, 176, 255, 0.25);
            border-radius: 18px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(224, 176, 255, 0.18);
            padding: 36px 32px;
            color: #FFFFFF;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #CC5500, #E0B0FF, #ECE8C9);
        }

        .auth-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .auth-brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(244, 180, 0, 0.15);
            border: 1px solid rgba(244, 180, 0, 0.3);
            border-radius: 20px;
            color: var(--accent-yellow);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        .auth-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .auth-header p {
            font-size: 13px;
            color: #94A3B8;
        }

        .role-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .role-tab {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 8px;
            font-size: 12px;
            font-weight: 600;
            color: #94A3B8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: transparent;
        }

        .role-tab:hover {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.08);
        }

        .role-tab.active {
            background: var(--accent-yellow);
            color: #1F2937;
            box-shadow: 0 2px 10px rgba(244, 180, 0, 0.35);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #CBD5E1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #94A3B8;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .input-field {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 10px;
            color: #FFFFFF;
            font-size: 14px;
            font-family: var(--font-sans);
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field::placeholder {
            color: #64748B;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-yellow);
            box-shadow: 0 0 0 3px rgba(244, 180, 0, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: transparent;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .toggle-password:hover {
            color: #FFFFFF;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-yellow);
            color: #1F2937;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 18px rgba(244, 180, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--accent-yellow-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(244, 180, 0, 0.45);
        }

        .auth-footer-nav {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #94A3B8;
        }

        .auth-footer-nav a {
            color: var(--accent-yellow);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .auth-footer-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="full-page-bg">
    <div class="app-container">
        <!-- Dynamic Header Navbar -->
        <header id="navbar-header"></header>

        <!-- Auth Center Box -->
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-brand-badge">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        Secure Operations Portal
                    </div>
                    <h2>Welcome Back</h2>
                    <p>Select your account role to autofill or enter credentials.</p>
                </div>

                <!-- Interactive Role Tabs for One-Click Quick Demo -->
                <div class="role-selector">
                    <button type="button" class="role-tab active" id="tab-rider">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        Rider
                    </button>
                    <button type="button" class="role-tab" id="tab-driver">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                        Driver
                    </button>
                    <button type="button" class="role-tab" id="tab-admin">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2z"></path></svg>
                        Admin
                    </button>
                </div>

                <div id="login-error" style="display: none; background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #FCA5A5; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 18px;"></div>

                <form id="form-login">
                    <div class="input-group">
                        <label for="login-username">Username</label>
                        <div class="input-field-wrapper">
                            <div class="input-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </div>
                            <input type="text" id="login-username" class="input-field" placeholder="Enter username" value="rider1" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <div class="input-field-wrapper">
                            <div class="input-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            </div>
                            <input type="password" id="login-password" class="input-field" placeholder="Enter password" value="rider123" required>
                            <button type="button" id="btn-toggle-pwd" class="toggle-password" title="Toggle password visibility">
                                <svg id="pwd-eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">
                        <span>Log In to Engine</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </form>

                <div class="auth-footer-nav">
                    <a href="index.html">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        Back to Overview
                    </a>
                    <span>API Status: <strong style="color: #4ADE80;">Online</strong></span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
